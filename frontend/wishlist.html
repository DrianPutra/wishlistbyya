<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Wishlist — Cepat Terwujud Ya!</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <style>

        /* =========================================
           COLOR PALETTE
        ========================================= */

        :root {

            --bg-main: #FAF9F6;
            --bg-soft: #F2EDE9;

            --card: #FFFFFF;

            --dark: #2D2D2D;
            --dark-hover: #454545;

            --soft-brown: #8E7F7F;

            --muted: #8C857B;

            --border: #DCD6CD;

            --danger: #C96B6B;

            --shadow:
                0 12px 35px rgba(45,45,45,0.07);

            --shadow-hover:
                0 18px 40px rgba(45,45,45,0.12);
        }



        /* =========================================
           RESET
        ========================================= */

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

            font-family: 'Quicksand', sans-serif;

        }



        /* =========================================
           BODY
        ========================================= */

        body {

            background:
                linear-gradient(
                    135deg,
                    #FAF9F6 0%,
                    #F2EDE9 100%
                );

            min-height: 100vh;

            padding: 35px 20px 60px;

            color: var(--dark);

        }



        /* =========================================
           CONTAINER
        ========================================= */

        .container {

            width: 100%;

            max-width: 900px;

            margin: auto;

        }



        /* =========================================
           HEADER
        ========================================= */

        header {

            background: rgba(255,255,255,0.95);

            border: 1px solid var(--border);

            border-radius: 24px;

            padding: 25px 28px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 24px;

            box-shadow: var(--shadow);

        }



        .header-title h1 {

            font-size: 30px;

            font-weight: 700;

            color: var(--dark);

            letter-spacing: 0.2px;

        }



        .header-title p {

            font-size: 13px;

            color: var(--muted);

            margin-top: 4px;

        }



        /* =========================================
           BACK TO FOLDER
        ========================================= */

        .back-folder {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            margin-bottom: 12px;

            color: var(--muted);

            text-decoration: none;

            font-size: 11px;

            font-weight: 600;

            transition: .2s;

        }


        .back-folder:hover {

            color: var(--dark);

            transform: translateX(-2px);

        }



        /* =========================================
           ADD BUTTON
        ========================================= */

        .btn-add {

            background: var(--dark);

            color: white;

            border: none;

            padding: 11px 18px;

            border-radius: 14px;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            display: flex;

            align-items: center;

            gap: 7px;

            transition: all .3s ease;

            box-shadow:
                0 6px 15px rgba(45,45,45,.12);

        }


        .btn-add:hover {

            background: var(--dark-hover);

            transform: translateY(-2px);

            box-shadow:
                0 9px 20px rgba(45,45,45,.18);

        }



        /* =========================================
           WISHLIST LIST
        ========================================= */

        .wishlist-grid {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }



        /* =========================================
           WISHLIST CARD
        ========================================= */

        .wish-card {

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 20px;

            padding: 20px 22px;

            box-shadow: var(--shadow);

            display: flex;

            align-items: center;

            gap: 18px;

            transition: all .3s ease;

            position: relative;

        }


        .wish-card:hover {

            transform: translateY(-3px);

            box-shadow: var(--shadow-hover);

        }



        /* =========================================
           TAG
        ========================================= */

        .wish-tag {

            background: var(--bg-soft);

            color: var(--soft-brown);

            border: 1px solid #E7DFD8;

            padding: 7px 12px;

            border-radius: 30px;

            font-size: 10px;

            font-weight: 600;

            white-space: nowrap;

            order: 1;

        }



        /* =========================================
           CONTENT
        ========================================= */

        .wish-content {

            flex: 1;

            min-width: 0;

        }


        .wish-name {

            font-size: 18px;

            font-weight: 700;

            color: var(--dark);

            margin-bottom: 3px;

            word-break: break-word;

        }


        .wish-price {

            font-size: 12px;

            color: var(--muted);

            font-weight: 500;

        }



        /* =========================================
           ACTIONS
        ========================================= */

        .wish-actions {

            display: flex;

            align-items: center;

            gap: 7px;

            border: none;

            padding: 0;

            margin: 0;

            order: 3;

            flex-shrink: 0;

        }


        .btn-action {

            border: none;

            cursor: pointer;

            font-size: 11px;

            font-weight: 600;

            display: flex;

            align-items: center;

            gap: 5px;

            transition: all .25s ease;

        }



        /* =========================================
           CHECK BUTTON
        ========================================= */

        .btn-check {

            background: var(--bg-soft);

            color: var(--dark);

            padding: 9px 13px;

            border-radius: 12px;

        }


        .btn-check:hover {

            background: var(--dark);

            color: white;

            transform: translateY(-1px);

        }



        /* =========================================
           THREE DOT
        ========================================= */

        .wish-menu-btn {

            width: 34px;

            height: 34px;

            border: none;

            background: transparent;

            color: #AAA;

            border-radius: 50%;

            cursor: pointer;

            transition: all .2s ease;

        }


        .wish-menu-btn:hover {

            background: var(--bg-soft);

            color: var(--dark);

        }



        /* =========================================
           DROPDOWN MENU
        ========================================= */

        .wish-menu {

            position: absolute;

            right: 18px;

            top: 62px;

            width: 130px;

            background: white;

            border: 1px solid var(--border);

            border-radius: 12px;

            padding: 6px;

            box-shadow:
                0 12px 30px rgba(0,0,0,.10);

            z-index: 20;

            display: none;

        }


        .wish-menu.active {

            display: block;

        }


        .wish-menu-item {

            width: 100%;

            border: none;

            background: transparent;

            padding: 10px 11px;

            border-radius: 8px;

            text-align: left;

            font-size: 11px;

            color: var(--dark);

            cursor: pointer;

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .wish-menu-item:hover {

            background: var(--bg-soft);

        }


        .wish-menu-item.delete {

            color: var(--danger);

        }


        .wish-menu-item.delete:hover {

            background: #F7E8E8;

        }



        /* =========================================
           COMPLETED
        ========================================= */

        .wish-card.completed {

            background: #F7F5F2;

            opacity: .65;

        }


        .wish-card.completed .wish-name {

            text-decoration: line-through;

            color: var(--muted);

        }


        .wish-card.completed .btn-check {

            background: var(--dark);

            color: white;

        }



        /* =========================================
           EMPTY STATE
        ========================================= */

        .empty-state {

            background: rgba(255,255,255,.8);

            border: 1px dashed var(--border);

            border-radius: 20px;

            padding: 60px 20px;

            text-align: center;

            display: none;

        }


        .empty-state i {

            font-size: 34px;

            color: var(--muted);

            margin-bottom: 13px;

        }


        .empty-state h3 {

            font-size: 20px;

            margin-bottom: 5px;

        }


        .empty-state p {

            font-size: 11px;

            color: var(--muted);

        }



        /* =========================================
           MODAL
        ========================================= */

        .modal-overlay {

            position: fixed;

            inset: 0;

            background: rgba(45,45,45,.35);

            backdrop-filter: blur(5px);

            display: none;

            align-items: center;

            justify-content: center;

            z-index: 100;

            padding: 20px;

        }


        .modal-overlay.active {

            display: flex;

        }


        .modal {

            background: white;

            width: 100%;

            max-width: 400px;

            padding: 30px;

            border-radius: 24px;

            border: 1px solid var(--border);

            box-shadow:
                0 20px 50px rgba(45,45,45,.15);

            animation: modalShow .25s ease;

        }


        @keyframes modalShow {

            from {

                opacity: 0;

                transform:
                    translateY(10px)
                    scale(.98);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        .modal h2 {

            font-size: 23px;

            color: var(--dark);

            margin-bottom: 22px;

            text-align: center;

        }



        /* =========================================
           INPUT
        ========================================= */

        .modal-input-group {

            margin-bottom: 15px;

        }


        .modal-input-group label {

            display: block;

            font-size: 12px;

            font-weight: 600;

            color: var(--dark);

            margin-bottom: 6px;

        }


        .modal-input-group input {

            width: 100%;

            padding: 11px 13px;

            border-radius: 12px;

            border: 1.5px solid var(--border);

            background: var(--bg-soft);

            outline: none;

            font-size: 13px;

            color: var(--dark);

            transition: .25s;

        }


        .modal-input-group input:focus {

            background: white;

            border-color: var(--soft-brown);

            box-shadow:
                0 0 0 4px rgba(142,127,127,.10);

        }



        /* =========================================
           MODAL BUTTONS
        ========================================= */

        .modal-buttons {

            display: flex;

            gap: 10px;

            margin-top: 22px;

        }


        .btn-cancel,
        .btn-save {

            flex: 1;

            padding: 11px;

            border-radius: 12px;

            border: none;

            cursor: pointer;

            font-size: 13px;

            font-weight: 600;

            transition: .25s;

        }


        .btn-cancel {

            background: var(--bg-soft);

            color: var(--dark);

        }


        .btn-cancel:hover {

            background: #E7DFD8;

        }


        .btn-save {

            background: var(--dark);

            color: white;

        }


        .btn-save:hover {

            background: var(--dark-hover);

            transform: translateY(-1px);

        }



        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 600px) {

            body {

                padding: 20px 15px;

            }


            header {

                padding: 20px;

                align-items: flex-start;

                flex-direction: column;

            }


            .btn-add {

                width: 100%;

                justify-content: center;

            }


            .wish-card {

                flex-wrap: wrap;

                padding: 18px;

            }


            .wish-content {

                order: 2;

                width: 100%;

            }


            .wish-tag {

                order: 1;

            }


            .wish-actions {

                order: 3;

                width: 100%;

                justify-content: flex-end;

                border-top: 1px solid #EEE8E2;

                padding-top: 12px;

            }

        }

    
        /* Dropdown layering only */
        .wish-card.menu-open {
            z-index: 1000;
        }

        .wish-card.menu-open .wish-menu {
            z-index: 1001;
        }


        /* =====================================================
           SIMPLE NOTES WISHLIST START
        ===================================================== */


        /* ==========================================

        ========================================== */

        }

        }

            padding:
                10px 15px;

            box-shadow:
                none;
        }


        /* ==========================================
           LIST
        ========================================== */

        .wishlist-grid {
            width:
                100%;

            display:
                flex;

            flex-direction:
                column;

            gap:
                9px;
        }


        /* ==========================================

        ========================================== */

        .wish-card {

                0;

            background:

            border:

            box-shadow:

            grid-template-columns:

            align-items:
                center;

            gap:
                10px;

            position:
                relative;

            transition:
                border-color .2s ease,

        }


        .wish-card:hover {
            transform:

            box-shadow:
                0 4px 16px
                rgba(45,45,45,.055);

            border-color:
                #CCC4BB;
        }


        /* ==========================================
           CHECKBOX
        ========================================== */

        .wish-check {
            width:
                30px;

            height:
                30px;

            min-width:

            border:

            border-radius:

            background:

            color:

            display:

            align-items:
                center;

            justify-content:
                center;

            cursor:
                pointer;

            padding:
                0;

            transition:
                all .18s ease;
        }


        .wish-check:hover {
            border-color:
                var(--dark);

            transform:
                scale(1.04);
        }


        .wish-check i {
            font-size:
                12px;
        }


        .wish-card.completed .wish-check {
            background:
                var(--dark);

            border-color:
                var(--dark);
        }


        /* ==========================================
           CONTENT
        ========================================== */

        .wish-content {
            min-width:
                0;

            width:
                auto;
        }


        .wish-name {
            margin:
                0;

            color:
                var(--dark);

            font-size:
                16px;

            line-height:
                1.4;

            font-weight:
                650;

            word-break:
                break-word;

            transition:
                color .2s ease;
        }


        /* ==========================================
           OPTIONAL META
        ========================================== */

        .wish-meta {
            display:
                flex;

            align-items:
                center;

            flex-wrap:
                wrap;

            gap:
                7px 11px;

            margin-top:
                4px;
        }


        .wish-price {
            color:
                var(--muted);

            font-size:
                11px;

            font-weight:
                500;
        }


        .wish-product-link {
            display:
                inline-flex;

            align-items:
                center;

            gap:
                5px;

            color:
                var(--soft-brown);

            font-size:
                11px;

            font-weight:
                600;

            text-decoration:
                none;
        }


        .wish-product-link:hover {
            color:
                var(--dark);

            text-decoration:
                underline;

            text-underline-offset:
                3px;
        }


        .wish-product-link i {
            font-size:
                9px;
        }


        /* ==========================================
           REMOVE OLD VISUALS
        ========================================== */

        .wish-tag {
            display:
                none !important;
        }


        .wish-actions {
            width:
                auto;

            padding:
                0;

            margin:
                0;

            border:
                none;

            display:
                flex;

            justify-content:
                flex-end;

            order:
                initial;
        }


        .btn-action.btn-check {
            display:
                none !important;
        }


        /* ==========================================
           THREE DOT
        ========================================== */

        .wish-menu-btn {
            width:
                30px;

            height:
                30px;

            flex-shrink:
                0;
        }


        .wish-menu {
            top:
                calc(100% - 4px);

            right:
                8px;
        }


        /* ==========================================
           COMPLETED
        ========================================== */

        .wish-card.completed {
            background:
                #F8F7F5;

            opacity:
                1;
        }


        .wish-card.completed .wish-name {
            color:
                var(--muted);

            text-decoration:
                line-through;

            text-decoration-thickness:
                1.5px;

            text-decoration-color:
                #A39B92;
        }


        .wish-card.completed .wish-meta {
            opacity:
                .6;
        }


        /* ==========================================
           EMPTY
        ========================================== */

        .empty-state {
            padding:
                38px 20px;

            border-radius:
                17px;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            }

            }

                    15px;
            }


            .wish-meta {

                    3px;

                gap:

            }

            .wish-product-link {

            }

                border:
                    none;

        }


        /* SIMPLE NOTES WISHLIST END */

</style>

            </label>

                type="text"
                id="itemTag"
                placeholder="contoh: Target Akhir Tahun"
            >

        </div>


        <div class="modal-input-group">

            <label>
                Link Produk (opsional)
            </label>

            <input
                type="url"
                id="itemProductUrl"
                placeholder="contoh: https://shopee.co.id/..."
            >

        </div>


        <div class="modal-buttons">

            <button
                class="btn-cancel"
                onclick="closeModal()"
            >

                Batal

            </button>


            <button
                class="btn-save"
                onclick="saveWishlistItem()"
            >

                Simpan

            </button>

        </div>

    </div>

</div>






    <script src="js/api.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/wishlist-private.js"></script>
</body>
