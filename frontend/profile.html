<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile Settings</title>

    <style>

        :root {
            --bg-color: #FAF9F6;
            --card-bg: #FFFFFF;

            --dark-primary: #2D2D2D;
            --dark-hover: #454545;

            --beige: #F2EDE9;
            --beige-dark: #E4DDD5;

            --border-color: #DCD6CD;

            --text-dark: #2D2D2D;
            --text-muted: #8C857B;

            --danger: #B96A6A;

            --shadow-subtle:
                0 10px 30px rgba(45,45,45,0.06);

            --shadow-hover:
                0 15px 35px rgba(45,45,45,0.10);
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            min-height: 100vh;

            background:
                var(--bg-color);

            color:
                var(--text-dark);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        button,
        input {
            font: inherit;
        }


        button {
            cursor: pointer;
        }


        .page {
            width: min(
                900px,
                calc(100% - 40px)
            );

            margin: 0 auto;

            padding:
                40px 0 70px;
        }


        /* =========================
           TOP
        ========================= */

        .topbar {
            margin-bottom: 28px;
        }


        .back-link {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            text-decoration: none;

            color:
                var(--text-muted);

            font-size: 12px;

            margin-bottom: 25px;

            transition: 0.2s;
        }


        .back-link:hover {
            color:
                var(--dark-primary);
        }


        .page-title {
            font-size: 34px;

            line-height: 1.1;

            margin-bottom: 8px;
        }


        .page-description {
            color:
                var(--text-muted);

            font-size: 12px;

            line-height: 1.7;
        }


        /* =========================
           PROFILE HERO
        ========================= */

        .profile-hero {
            background:
                var(--card-bg);

            border:
                1px solid
                var(--border-color);

            border-radius: 20px;

            box-shadow:
                var(--shadow-subtle);

            padding: 30px;

            margin-bottom: 18px;

            display: flex;

            align-items: center;

            gap: 22px;
        }


        .avatar-wrapper {
            position: relative;

            flex-shrink: 0;
        }


        .profile-avatar {
            width: 100px;

            height: 100px;

            border-radius: 50%;

            background:
                var(--dark-primary);

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            font-size: 28px;

            font-weight: 700;

            border:
                4px solid
                var(--beige);
        }


        .profile-avatar img {
            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;
        }


        .hero-info {
            min-width: 0;

            flex: 1;
        }


        .hero-username {
            font-size: 24px;

            font-weight: 700;

            margin-bottom: 7px;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .hero-email {
            font-size: 12px;

            color:
                var(--text-muted);

            overflow-wrap:
                anywhere;
        }


        /* =========================
           GRID
        ========================= */

        .settings-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 18px;
        }


        .settings-card {
            background:
                var(--card-bg);

            border:
                1px solid
                var(--border-color);

            border-radius: 20px;

            box-shadow:
                var(--shadow-subtle);

            padding: 28px;
        }


        .card-header {
            margin-bottom: 24px;
        }


        .card-title {
            font-size: 17px;

            margin-bottom: 6px;
        }


        .card-description {
            color:
                var(--text-muted);

            font-size: 10px;

            line-height: 1.6;
        }


        /* =========================
           AVATAR
        ========================= */

        .avatar-actions {
            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 23px;
        }


        #avatarInput {
            display: none;
        }


        .btn-secondary,
        .btn-danger-soft {
            border:
                1px solid
                var(--border-color);

            border-radius: 20px;

            padding:
                9px 15px;

            background:
                var(--beige);

            color:
                var(--text-dark);

            font-size: 10px;

            transition: 0.2s;
        }


        .btn-secondary:hover {
            background:
                var(--beige-dark);
        }


        .btn-danger-soft {
            background: white;

            color:
                var(--danger);
        }


        .btn-danger-soft:hover {
            background:
                #F9EEEE;
        }


        .btn-secondary:disabled {
            opacity: 0.45;

            cursor:
                not-allowed;
        }


        .avatar-note {
            font-size: 9px;

            color:
                var(--text-muted);

            margin-top: -13px;

            margin-bottom: 23px;

            line-height: 1.5;
        }


        /* =========================
           FORM
        ========================= */

        .input-group {
            margin-bottom: 17px;
        }


        .input-group label {
            display: block;

            font-size: 10px;

            font-weight: 600;

            margin-bottom: 7px;
        }


        .input-group input {
            width: 100%;

            border:
                1px solid
                var(--border-color);

            background:
                #FAF8F5;

            border-radius: 10px;

            padding:
                11px 13px;

            outline: none;

            font-size: 11px;

            color:
                var(--text-dark);

            transition: 0.2s;
        }


        .input-group input:focus {
            background: white;

            border-color:
                var(--dark-primary);

            box-shadow:
                0 0 0 3px
                rgba(45,45,45,0.06);
        }


        .input-group input:disabled {
            opacity: 0.6;
        }


        /* =========================
           BUTTON
        ========================= */

        .btn-primary {
            width: 100%;

            border: none;

            border-radius: 20px;

            padding:
                11px 18px;

            margin-top: 4px;

            background:
                var(--dark-primary);

            color: white;

            font-size: 11px;

            font-weight: 600;

            transition: 0.2s;
        }


        .btn-primary:hover {
            background:
                var(--dark-hover);
        }


        .btn-primary:disabled {
            opacity: 0.6;

            cursor:
                not-allowed;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            display: none;

            margin-bottom: 18px;

            padding:
                11px 14px;

            border-radius: 10px;

            font-size: 10px;

            line-height: 1.5;
        }


        .message.success {
            display: block;

            background:
                #EDF5EE;

            color:
                #57705B;

            border:
                1px solid
                #D8E8DA;
        }


        .message.error {
            display: block;

            background:
                #F9EEEE;

            color:
                var(--danger);

            border:
                1px solid
                #EEDADA;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (
            max-width: 720px
        ) {

            .page {
                width:
                    calc(100% - 28px);

                padding-top:
                    25px;
            }


            .page-title {
                font-size: 29px;
            }


            .profile-hero {
                flex-direction:
                    column;

                text-align: center;

                padding: 25px;
            }


            .profile-avatar {
                width: 90px;

                height: 90px;
            }


            .settings-grid {
                grid-template-columns:
                    1fr;
            }


            .settings-card {
                padding: 22px;
            }
        }

    </style>

</head>


<body>

    <main class="page">

        <header class="topbar">

            <a
                href="folders.html"
                class="back-link"
            >
                ← Kembali ke My Folders
            </a>

            <h1 class="page-title">
                Profile Settings
            </h1>

            <p class="page-description">
                Kelola informasi profile dan keamanan akun kamu.
            </p>

        </header>


        <div
            id="pageMessage"
            class="message"
        ></div>


        <section class="profile-hero">

            <div class="avatar-wrapper">

                <div
                    class="profile-avatar"
                    id="profileAvatar"
                >
                    --
                </div>

            </div>


            <div class="hero-info">

                <div
                    class="hero-username"
                    id="heroUsername"
                >
                    Loading...
                </div>

                <div
                    class="hero-email"
                    id="heroEmail"
                >
                    Loading...
                </div>

            </div>

        </section>


        <div class="settings-grid">

            <!-- PROFILE -->

            <section class="settings-card">

                <div class="card-header">

                    <h2 class="card-title">
                        Informasi Profile
                    </h2>

                    <p class="card-description">
                        Ubah foto, username,
                        dan email akun kamu.
                    </p>

                </div>


                <input
                    type="file"
                    id="avatarInput"
                    accept="image/jpeg,image/png,image/webp"
                >


                <div class="avatar-actions">

                    <button
                        type="button"
                        class="btn-secondary"
                        id="chooseAvatarButton"
                    >
                        Pilih Foto
                    </button>


                    <button
                        type="button"
                        class="btn-secondary"
                        id="uploadAvatarButton"
                        disabled
                    >
                        Simpan Foto
                    </button>


                    <button
                        type="button"
                        class="btn-danger-soft"
                        id="deleteAvatarButton"
                    >
                        Hapus Foto
                    </button>

                </div>


                <p class="avatar-note">
                    JPG, PNG, atau WEBP.
                    Maksimal 5 MB.
                </p>


                <form id="profileForm">

                    <div class="input-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            maxlength="50"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            maxlength="255"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn-primary"
                        id="saveProfileButton"
                    >
                        Simpan Perubahan
                    </button>

                </form>

            </section>


            <!-- PASSWORD -->

            <section class="settings-card">

                <div class="card-header">

                    <h2 class="card-title">
                        Keamanan Akun
                    </h2>

                    <p class="card-description">
                        Gunakan password yang kuat
                        dan tidak mudah ditebak.
                    </p>

                </div>


                <form id="passwordForm">

                    <div class="input-group">

                        <label for="currentPassword">
                            Password Saat Ini
                        </label>

                        <input
                            type="password"
                            id="currentPassword"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="newPassword">
                            Password Baru
                        </label>

                        <input
                            type="password"
                            id="newPassword"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="confirmPassword">
                            Konfirmasi Password Baru
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn-primary"
                        id="changePasswordButton"
                    >
                        Ganti Password
                    </button>

                </form>

            </section>

        </div>

    </main>


    <script
        src="js/api.js"
        defer
    ></script>

    <script
        src="js/auth-guard.js"
        defer
    ></script>

    <script
        src="js/profile.js"
        defer
    ></script>

</body>

</html>
