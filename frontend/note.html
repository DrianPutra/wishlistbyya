<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Note</title>


    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >


    <style>

        :root {

            --bg-color: #FAF9F6;
            --card-bg: #FFFFFF;

            --dark-primary: #2D2D2D;
            --dark-hover: #454545;

            --beige: #F2EDE9;

            --border-color: #DCD6CD;

            --text-dark: #2D2D2D;
            --text-muted: #8C857B;

            --danger: #B96A6A;

            --shadow:
                0 10px 30px
                rgba(45,45,45,0.06);
        }


        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

            font-family:
                "Poppins",
                sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                var(--bg-color);

            color:
                var(--text-dark);

            padding:
                28px 20px 70px;
        }


        .container {

            width: 100%;
            max-width: 950px;

            margin:
                0 auto;
        }


        .topbar {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;

            margin-bottom:
                20px;
        }


        .back {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            border:
                1px solid
                var(--border-color);

            background:
                var(--card-bg);

            color:
                var(--text-dark);

            padding:
                8px 13px;

            border-radius: 10px;

            text-decoration:
                none;

            font-size: 11px;

            font-weight: 600;
        }


        .note-role {

            color:
                var(--text-muted);

            background:
                var(--beige);

            border-radius: 20px;

            padding:
                6px 11px;

            font-size: 9px;
        }


        .editor {

            background:
                var(--card-bg);

            border:
                1px solid
                var(--border-color);

            border-radius: 22px;

            box-shadow:
                var(--shadow);

            padding:
                30px;
        }


        .title-input {

            display: block;

            width: 100%;

            border: none;

            outline: none;

            background:
                transparent;

            color:
                var(--text-dark);

            font-family:
                "Fredoka",
                sans-serif;

            font-size:
                clamp(
                    28px,
                    5vw,
                    39px
                );

            font-weight: 600;

            margin-bottom:
                20px;
        }


        .content-input {

            display: block;

            width: 100%;

            min-height: 430px;

            resize: vertical;

            border: none;

            outline: none;

            background:
                transparent;

            color:
                var(--text-dark);

            font-size: 14px;

            line-height: 1.8;
        }


        .editor-footer {

            border-top:
                1px solid
                var(--border-color);

            margin-top:
                20px;

            padding-top:
                16px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 15px;
        }


        .save-status {

            color:
                var(--text-muted);

            font-size: 10px;
        }


        .actions {

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .btn {

            border: none;

            border-radius: 10px;

            padding:
                10px 15px;

            font-size: 11px;

            font-weight: 600;

            cursor: pointer;
        }


        .btn-save {

            background:
                var(--dark-primary);

            color: white;
        }


        .btn-save:hover {

            background:
                var(--dark-hover);
        }


        .btn-delete {

            background:
                #F6ECEC;

            color:
                var(--danger);
        }


        .btn:disabled {

            opacity: 0.5;

            cursor: default;
        }


        .readonly-message {

            display: none;

            margin-bottom: 14px;

            border:
                1px solid
                var(--border-color);

            background:
                var(--beige);

            border-radius: 12px;

            padding:
                10px 13px;

            color:
                var(--text-muted);

            font-size: 10px;
        }


        .readonly-message.visible {

            display: block;
        }


        @media (
            max-width: 650px
        ) {

            body {

                padding:
                    14px 14px 50px;
            }


            .editor {

                padding:
                    22px 18px;
            }


            .content-input {

                min-height:
                    360px;

                font-size:
                    13px;
            }


            .editor-footer {

                align-items:
                    flex-start;

                flex-direction:
                    column;
            }


            .actions {

                width: 100%;
            }


            .btn-save {

                flex: 1;
            }

        }


        /* =====================================================
           NOTE SHARING UI START
        ===================================================== */

        .topbar-right {

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .btn-share {

            display: none;

            border: none;

            border-radius: 10px;

            padding:
                8px 12px;

            background:
                var(--dark-primary);

            color: white;

            font-size: 10px;

            font-weight: 600;

            cursor: pointer;
        }


        .btn-share.visible {

            display:
                inline-flex;

            align-items: center;

            gap: 6px;
        }


        .btn-share:hover {

            background:
                var(--dark-hover);
        }


        /* MEMBERS */

        .note-members {

            margin-bottom:
                16px;

            padding:
                12px 14px;

            border:
                1px solid
                var(--border-color);

            border-radius:
                14px;

            background:
                var(--card-bg);

            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 8px;
        }


        .members-label {

            color:
                var(--text-muted);

            font-size: 10px;

            font-weight: 600;

            margin-right: 3px;
        }


        .member-chip {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding:
                5px 9px 5px 5px;

            border-radius:
                30px;

            background:
                var(--beige);

            font-size: 9px;
        }


        .member-avatar {

            width: 24px;
            height: 24px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                var(--dark-primary);

            color: white;

            font-size: 8px;
            font-weight: 700;

            flex-shrink: 0;
        }


        .member-name {

            font-weight: 600;
        }


        .member-role {

            color:
                var(--text-muted);

            font-size: 8px;
        }


        .member-remove {

            width: 20px;
            height: 20px;

            border: none;

            border-radius: 50%;

            background:
                transparent;

            color:
                var(--danger);

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-size: 9px;
        }


        .member-remove:hover {

            background:
                rgba(185,106,106,0.10);
        }


        /* SHARE MODAL */

        .share-modal-overlay {

            position: fixed;

            inset: 0;

            padding: 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                rgba(45,45,45,0.30);

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.2s ease,
                visibility 0.2s ease;

            z-index: 1000;
        }


        .share-modal-overlay.active {

            opacity: 1;

            visibility: visible;
        }


        .share-modal {

            width: 100%;

            max-width: 420px;

            padding: 24px;

            border:
                1px solid
                var(--border-color);

            border-radius: 20px;

            background:
                var(--card-bg);

            box-shadow:
                0 20px 50px
                rgba(45,45,45,0.15);
        }


        .share-modal h2 {

            font-family:
                "Fredoka",
                sans-serif;

            font-size: 23px;

            margin-bottom: 5px;
        }


        .share-modal-description {

            color:
                var(--text-muted);

            font-size: 10px;

            margin-bottom: 18px;
        }


        .share-input-group {

            display: flex;

            flex-direction: column;

            gap: 6px;

            margin-bottom: 13px;
        }


        .share-input-group label {

            font-size: 10px;

            font-weight: 600;
        }


        .share-input-group input,
        .share-input-group select {

            width: 100%;

            border:
                1px solid
                var(--border-color);

            border-radius: 10px;

            padding:
                10px 12px;

            background: white;

            color:
                var(--text-dark);

            outline: none;

            font-size: 12px;
        }


        .share-modal-actions {

            margin-top: 20px;

            display: flex;

            justify-content: flex-end;

            gap: 8px;
        }


        .share-cancel,
        .share-submit {

            border: none;

            border-radius: 10px;

            padding:
                10px 15px;

            font-size: 10px;

            font-weight: 600;

            cursor: pointer;
        }


        .share-cancel {

            background:
                var(--beige);

            color:
                var(--text-dark);
        }


        .share-submit {

            background:
                var(--dark-primary);

            color: white;
        }


        .share-submit:disabled {

            opacity: 0.6;

            cursor: default;
        }


        @media (max-width: 650px) {

            .topbar {

                align-items:
                    flex-start;
            }


            .topbar-right {

                flex-wrap: wrap;

                justify-content:
                    flex-end;
            }


            .note-members {

                padding:
                    10px 11px;

                gap: 6px;
            }


            .member-chip {

                max-width: 100%;
            }


            .member-name {

                max-width: 100px;

                overflow: hidden;

                white-space: nowrap;

                text-overflow: ellipsis;
            }


            .share-modal {

                padding:
                    21px 18px;
            }

        }

        /* NOTE SHARING UI END */
</style>

</head>


<body>


    <main class="container">


        <div class="topbar">

            <a
                class="back"
                href="notes.html"
            >

                <i
                    class="fa-solid fa-arrow-left"
                ></i>

                My Notes

            </a>


            <div class="topbar-right">

                <div
                    class="note-role"
                    id="noteRole"
                >
                    ...
                </div>


                <button
                    class="btn-share"
                    id="shareNoteButton"
                    type="button"
                >

                    <i
                        class="fa-solid fa-user-plus"
                    ></i>

                    Bagikan

                </button>

            </div>

        </div>


        <div
            class="readonly-message"
            id="readonlyMessage"
        >
            Kamu hanya memiliki akses untuk membaca note ini.
        </div>


        <div
            class="note-members"
            id="noteMembers"
        >

            <span class="members-label">
                Anggota
            </span>

            <span
                class="member-role"
            >
                Memuat...
            </span>

        </div>


        <section class="editor">


            <input
                class="title-input"
                id="noteTitle"
                type="text"
                maxlength="200"
                placeholder="Judul Note"
            >


            <textarea
                class="content-input"
                id="noteContent"
                placeholder="Mulai menulis..."
            ></textarea>


            <div class="editor-footer">


                <div
                    class="save-status"
                    id="saveStatus"
                >
                    Memuat note...
                </div>


                <div class="actions">

                    <button
                        class="btn btn-delete"
                        id="deleteNoteButton"
                        type="button"
                    >
                        Hapus
                    </button>


                    <button
                        class="btn btn-save"
                        id="saveNoteButton"
                        type="button"
                    >
                        Simpan
                    </button>

                </div>

            </div>


        </section>


    </main>



    <div
        class="share-modal-overlay"
        id="shareNoteModal"
    >

        <div class="share-modal">

            <h2>
                Bagikan Note
            </h2>

            <p class="share-modal-description">
                Masukkan email akun yang ingin kamu beri akses.
            </p>


            <div class="share-input-group">

                <label for="shareEmail">
                    Email
                </label>

                <input
                    id="shareEmail"
                    type="email"
                    placeholder="contoh@email.com"
                >

            </div>


            <div class="share-input-group">

                <label for="shareRole">
                    Akses
                </label>

                <select
                    id="shareRole"
                >

                    <option value="editor">
                        Editor - bisa membaca dan mengedit
                    </option>

                    <option value="viewer">
                        Viewer - hanya membaca
                    </option>

                </select>

            </div>


            <div class="share-modal-actions">

                <button
                    class="share-cancel"
                    type="button"
                    id="shareCancelButton"
                >
                    Batal
                </button>


                <button
                    class="share-submit"
                    type="button"
                    id="shareSubmitButton"
                >
                    Bagikan
                </button>

            </div>

        </div>

    </div>

<script src="js/api.js"></script>

    <script src="js/auth-guard.js"></script>

    <script src="js/note.js"></script>


</body>

</html>
