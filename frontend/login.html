<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Masuk â€” Wishlist</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>

<body>

    <div class="container">

        <div class="header">

            <h1>Masuk</h1>

            <p>
                Selamat datang kembali â™¡
            </p>

        </div>


        <form id="loginForm">

            <!-- EMAIL -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <div class="input-wrapper">

                    <i
                        class="fa-regular fa-envelope icon-prefix"
                    ></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nama@email.com"
                    >

                </div>

                <div
                    class="error-message"
                    id="emailError"
                >
                    Masukkan email yang valid.
                </div>

            </div>


            <!-- PASSWORD -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <i
                        class="fa-solid fa-lock icon-prefix"
                    ></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password"
                    >

                    <i
                        class="fa-regular fa-eye toggle-password"
                        onclick="
                            toggleVisibility(
                                'password',
                                this
                            )
                        "
                    ></i>

                </div>

                <div
                    class="error-message"
                    id="passwordError"
                >
                    Password harus diisi.
                </div>

            </div>


            <!-- BUTTON -->
            <button
                type="submit"
                class="btn-submit"
            >
                Masuk
            </button>

        </form>


        <div class="footer">

            Belum punya akun?

            <a href="register.html">
                Daftar
            </a>

        </div>

    </div>


    <script src="js/api.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
